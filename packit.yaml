# Optional RPM/Packit packaging inherited from the Cockpit starter kit.
specfile_path: cockpit-nixos-manager.spec
copy_upstream_release_description: true

srpm_build_deps:
  - jq
  - make
  - nodejs-npm

actions:
  post-upstream-clone:
    - make cockpit-nixos-manager.spec
    - make node-cache
    - sh -c 'sed -i "/^Source1:/ s/https:.*/$(ls *-node*.tar.xz)/" cockpit-*.spec'
  create-archive: make dist
  get-current-version: make print-version

jobs:
  - job: tests
    trigger: pull_request
    targets: &test_targets
      - fedora-all
      - fedora-latest-stable-aarch64
      - centos-stream-9
      - centos-stream-9-aarch64
      - centos-stream-10

  - job: copr_build
    trigger: pull_request
    targets: *test_targets
